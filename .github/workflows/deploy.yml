name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write private settings on the server (.env.local, never in git)
        env:
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for NAME in TRIPADVISOR_API_KEY GOOGLE_PLACES_API_KEY ANTHROPIC_API_KEY; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "$NAME secret not set - skipping"
              continue
            fi
            printf '%s=%s\n' "$NAME" "$VALUE" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
              set -e
              cd /var/www/Trip_planner
              touch .env.local
              grep -v '^$NAME=' .env.local > .env.local.tmp || true
              cat >> .env.local.tmp
              mv .env.local.tmp .env.local
              chmod 600 .env.local
              echo '$NAME written to .env.local'
            "
          done

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -l -s' <<'REMOTE'
          export NVM_DIR="/root/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
          export PATH="/root/.nvm/versions/node/v18.20.8/bin:$PATH"
          set -eo pipefail
          cd /var/www/Trip_planner

          # The server keeps its own .env (real passwords). Save it, let git
          # update freely, then always put the server's copy back.
          ENV_KEEP="$HOME/.trip_planner_env_keep"
          if [ -f .env ]; then cp .env "$ENV_KEEP"; fi
          trap 'if [ -f "$ENV_KEEP" ]; then cp "$ENV_KEEP" .env; fi' EXIT
          git checkout -- .env 2>/dev/null || true

          git pull origin main
          if [ -f "$ENV_KEEP" ]; then cp "$ENV_KEEP" .env; fi

          npm install
          npx prisma db push --skip-generate
          # One-off data fixes (safe to repeat; print counts only)
          node scripts/fix-place-details.js || echo "place details fix skipped"
          npm run build

          # Exactly one copy of the site: remove any old/duplicate processes, start fresh
          pm2 delete tripplanner >/dev/null 2>&1 || true
          pm2 start npm --name tripplanner -- start
          pm2 save
          sudo systemctl restart nginx
          echo "✅ Deployment complete!"
          REMOTE

      - name: Check TripAdvisor search works (health check, never fails the deploy)
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -l -s' <<'REMOTE'
          cd /var/www/Trip_planner
          echo "Key line in .env.local: $(grep -c '^TRIPADVISOR_API_KEY=.\+' .env.local 2>/dev/null || echo 0)"
          echo "Key line in .env:       $(grep -c '^TRIPADVISOR_API_KEY=.\+' .env 2>/dev/null || echo 0)"
          echo "TripAdvisor key fingerprint: $(grep '^TRIPADVISOR_API_KEY=' .env.local | tail -1 | cut -d= -f2- | tr -d '"\r ' | tr -d '\n' | sha256sum | cut -c1-12)"
          echo "Google key fingerprint: $(grep '^GOOGLE_PLACES_API_KEY=' .env.local | tail -1 | cut -d= -f2- | tr -d '"\r ' | tr -d '\n' | sha256sum | cut -c1-12)"
          sleep 8
          for q in "Hilton%20Paris" "Taj%20Mumbai"; do
            echo "--- search hotels: $q"
            curl -s -m 30 -w '\nHTTP %{http_code}\n' "http://localhost:3000/api/tripadvisor/search?query=$q&category=hotels" | head -c 1500
            echo
          done
          echo "--- recent server errors (types only, no user data)"
          for f in $HOME/.pm2/logs/tripplanner-error*.log; do
            [ -f "$f" ] && grep -hoE "(Trip (update|creation) error|AI import (failed|error|no cities)|code: '[A-Z0-9]+')[^{]{0,80}" "$f" | tail -6
          done
          echo "--- search activities: Mumbai"
          curl -s -m 30 "http://localhost:3000/api/tripadvisor/search?query=Gateway%20of%20India%20Mumbai&category=attractions" | grep -o '"name":"[^"]*"' | head -3
          echo "--- AI import (only if ANTHROPIC_API_KEY is set; tiny test, well under 1 cent)"
          export PATH="/root/.nvm/versions/node/v18.20.8/bin:$PATH"
          if grep -q '^ANTHROPIC_API_KEY=.\+' .env.local 2>/dev/null; then
            JOB=$(printf '%s' '{"fileName": "messy-test.xlsx", "text": "### Sheet: Summary\nOur Europe trip!!\tBudget 3000\nFlights\tTAP\n\n### Sheet: Plan\nWhen\tWhere\tWhat we did / thoughts\nMay 1 (46143 (2026-05-01 if this is a date))\tLisbon\tchecked into Memmo Alfama - great view 9/10\n\t\tdinner Taberna da Rua das Flores, book ahead\nMay 2\t\tBelem tower + pasteis de belem\nMay 3\tPorto\ttrain up, stayed at The Yeatman\n\t\tLivraria Lello (touristy 6/10), francesinha at Cafe Santiago\nMay 4\tPorto\tport tasting at Graham'\''s"}' \
              | curl -s -m 30 -X POST -H 'Content-Type: application/json' --data-binary @- http://localhost:3000/api/import/ai | grep -o '"jobId":"[^"]*"' | cut -d'"' -f4)
            echo "job: ${JOB:-none}"
            for i in $(seq 1 40); do
              sleep 3
              R=$(curl -s -m 30 "http://localhost:3000/api/import/ai?job=$JOB")
              case "$R" in *'"running"'*) continue;; esac
              echo "after $((i*3))s: $(echo "$R" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);if(j.status!=="done"){console.log("status="+j.status+" error="+j.error);return}const t=j.trip;console.log("cities="+t.cities.map(c=>c.name+"("+c.numberOfDays+"d,"+c.hotels.length+"h,"+c.days.reduce((n,x)=>n+x.restaurants.length+x.activities.length,0)+"p)").join(" ")+" warnings="+t.warnings.length)}catch(e){console.log("unreadable")}})')"
              break
            done
          else
            echo "ANTHROPIC_API_KEY not set - AI import off (template import still works)"
          fi
          echo "--- cover photo choices: Mexico City (links only, no photos loaded)"
          curl -s -m 30 "http://localhost:3000/api/places/cover-photos?query=Mexico%20City,%20Mexico" | grep -o '"thumb"' | wc -l
          echo "--- photo for a picked place (one photo)"
          P=$(curl -s -m 30 "http://localhost:3000/api/tripadvisor/search?query=Taj%20Mumbai&category=hotels" | grep -o '"photo_url":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "$P" ]; then
            curl -s -m 30 -o /dev/null -w 'photo link -> HTTP %{http_code}, redirects to: %{redirect_url}\n' "http://localhost:3000$P" | sed -E 's#(https://[^/]+)/.*#\1/...#'
          else
            echo "no photo_url in search results"
          fi
          echo "--- direct call from the server to Google Places (key hidden)"
          G=$(grep '^GOOGLE_PLACES_API_KEY=' .env.local | tail -1 | cut -d= -f2- | tr -d '"\r ')
          echo "Google key length: ${#G} (a normal key is 39), starts with AIza: $(case "$G" in AIza*) echo yes;; *) echo no;; esac)"
          if [ -n "$G" ]; then
            curl -s -m 30 -w '\nHTTP %{http_code}\n' -X POST 'https://places.googleapis.com/v1/places:searchText' \
              -H 'Content-Type: application/json' -H "X-Goog-Api-Key: $G" \
              -H 'X-Goog-FieldMask: places.id,places.displayName,places.formattedAddress' \
              -d '{"textQuery":"Hilton Paris","includedType":"lodging","pageSize":3}' | head -c 1200 | sed "s/$G/<KEY>/g"
            echo
          fi
          echo "--- direct call from the server to TripAdvisor (key hidden)"
          K=$(grep '^TRIPADVISOR_API_KEY=' .env.local | tail -1 | cut -d= -f2- | tr -d '"\r ')
          URL="https://api.content.tripadvisor.com/api/v1/location/search?key=$K&searchQuery=Hilton%20Paris&category=hotels&language=en"
          echo "[no referer]"
          curl -s -m 30 -w '\nHTTP %{http_code}\n' -H 'Accept: application/json' "$URL" | head -c 600 | sed "s/$K/<KEY>/g"
          echo
          echo "[referer https://tripshare.org]"
          curl -s -m 30 -w '\nHTTP %{http_code}\n' -H 'Accept: application/json' -H 'Referer: https://tripshare.org' "$URL" | head -c 600 | sed "s/$K/<KEY>/g"
          echo
          echo "Server public IP: $(curl -s -m 10 https://api.ipify.org || echo unknown)"
          REMOTE
