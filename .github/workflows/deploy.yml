name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write private settings on the server (.env.local, never in git)
        env:
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for NAME in TRIPADVISOR_API_KEY GOOGLE_PLACES_API_KEY ANTHROPIC_API_KEY; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "$NAME secret not set - skipping"
              continue
            fi
            printf '%s=%s\n' "$NAME" "$VALUE" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
              set -e
              cd /var/www/Trip_planner
              touch .env.local
              grep -v '^$NAME=' .env.local > .env.local.tmp || true
              cat >> .env.local.tmp
              mv .env.local.tmp .env.local
              chmod 600 .env.local
              echo '$NAME written to .env.local'
            "
          done

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -l -s' <<'REMOTE'
          export NVM_DIR="/root/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
          export PATH="/root/.nvm/versions/node/v18.20.8/bin:$PATH"
          set -eo pipefail
          cd /var/www/Trip_planner

          # The server keeps its own .env (real passwords). Save it, let git
          # update freely, then always put the server's copy back.
          ENV_KEEP="$HOME/.trip_planner_env_keep"
          if [ -f .env ]; then cp .env "$ENV_KEEP"; fi
          trap 'if [ -f "$ENV_KEEP" ]; then cp "$ENV_KEEP" .env; fi' EXIT
          git checkout -- .env 2>/dev/null || true

          git pull origin main
          if [ -f "$ENV_KEEP" ]; then cp "$ENV_KEEP" .env; fi

          npm install
          npx prisma db push --skip-generate
          # One-off data fixes (safe to repeat; print counts only)
          node scripts/fix-place-details.js || echo "place details fix skipped"
          node scripts/backfill-place-photos.js || true
          node scripts/photo-stats.js || true
          npm run build

          # Exactly one copy of the site: remove any old/duplicate processes, start fresh
          pm2 delete tripplanner >/dev/null 2>&1 || true
          pm2 start npm --name tripplanner -- start
          pm2 save
          sudo systemctl restart nginx
          echo "✅ Deployment complete!"
          REMOTE

      - name: Quick checks after deploy (never fail the deploy; counts / pass-fail only, logs are public)
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -l -s' <<'REMOTE'
          export PATH="/root/.nvm/versions/node/v18.20.8/bin:$PATH"
          cd /var/www/Trip_planner
          sleep 8
          echo "--- keys present: google=$(grep -c '^GOOGLE_PLACES_API_KEY=.\+' .env.local 2>/dev/null || echo 0) anthropic=$(grep -c '^ANTHROPIC_API_KEY=.\+' .env.local 2>/dev/null || echo 0)"
          echo "--- place search (1 Google search)"
          curl -s -m 30 "http://localhost:3000/api/tripadvisor/search?query=Hilton%20Paris&category=hotels" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const r=JSON.parse(d).results||[];console.log(r.length?"PASS search ("+r.length+" results)":"FAIL search returned nothing")}catch(e){console.log("FAIL search unreadable")}})'
          echo "--- sandbox API test (temporary test user, deleted afterwards)"
          node scripts/test-sandbox.js || true
          echo "--- recent server errors (types only, no user data)"
          for f in $HOME/.pm2/logs/tripplanner-error*.log; do
            [ -f "$f" ] && grep -hoE "(Trip (update|creation) error|AI import (failed|error|no cities)|Google Places search failed|code: '[A-Z0-9]+')[^{]{0,80}" "$f" | tail -6
          done
          REMOTE
